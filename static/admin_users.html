<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manage Users - Admin Console</title>
    <link rel="stylesheet" href="/static/style.css?v=3.6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .search-container { margin: 20px 0; position: relative; }
        .search-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 15px 15px 15px 45px; color: #fff; font-size: 0.95rem; outline: none; }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
        .user-list { display: flex; flex-direction: column; gap: 12px; }
        .user-card { background: #232e3c; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 15px; display: flex; align-items: center; gap: 15px; }
        .user-avatar { width: 45px; height: 45px; background: var(--accent-blue); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.2rem; }
        .user-info { flex: 1; }
        .user-name { display: block; font-weight: 700; margin-bottom: 2px; }
        .user-id-text { font-size: 0.75rem; color: var(--text-secondary); }
        .user-meta { text-align: right; }
        .user-balance { display: block; font-weight: 800; color: #10b981; font-family: 'Outfit', sans-serif; }
        .user-date { font-size: 0.7rem; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo" style="color: var(--warning);">Admin Console</span>
                <button class="close-sidebar" id="closeBtn"><i class="fas fa-times"></i></button>
            </div>
            <div class="sidebar-nav">
                <a href="/admin_panel" class="sidebar-item">
                    <i class="fas fa-chart-pie"></i> <span>Dashboard</span>
                </a>
                <a href="/admin_users" class="sidebar-item active">
                    <i class="fas fa-users-cog"></i> <span>Manage Users</span>
                </a>
                <a href="/admin_inventory" class="sidebar-item">
                    <i class="fas fa-box-open"></i> <span>Inventory</span>
                </a>
                <a href="/admin_deposits" class="sidebar-item">
                    <i class="fas fa-file-invoice-dollar"></i> <span>Deposits</span>
                </a>
                <a href="/" class="sidebar-item" style="opacity: 0.7;">
                    <i class="fas fa-sign-out-alt"></i> <span>Exit Admin</span>
                </a>
            </div>
        </nav>
        <div class="sidebar-overlay" id="overlay"></div>

        <!-- Header -->
        <header class="page-title">
            <div class="page-title-inner">
                <button class="hamburger-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
                <span>Users Pool</span>
                <div class="page-title-avatar" id="avatar">A</div>
            </div>
        </header>

        <main class="main-content">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" id="userSearch" placeholder="Search by name or ID...">
            </div>

            <div class="user-list" id="userList">
                <div style="text-align: center; color: var(--text-secondary); padding: 40px;">
                    <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 10px;"></i>
                    <p id="loadingMsg">Loading users...</p>
                </div>
            </div>

            <!-- Debug Area -->
            <div id="debugArea" style="margin-top: 20px; font-size: 10px; color: #888; background: #000; padding: 10px; border-radius: 10px; display: none;">
                <h4>Raw Debug:</h4>
                <pre id="rawJSON"></pre>
            </div>
        </main>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const adminUser = tg.initDataUnsafe.user;
        if (adminUser) document.getElementById('avatar').innerText = (adminUser.first_name || "A")[0].toUpperCase();

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');

        menuBtn.onclick = () => { sidebar.classList.add('open'); overlay.classList.add('open'); }
        closeBtn.onclick = overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

        let allUsers = [];

        async function loadUsers() {
            if (!adminUser || !adminUser.id) {
                document.getElementById('loadingMsg').innerText = "Waiting for Telegram...";
                setTimeout(loadUsers, 500);
                return;
            }
            try {
                const res = await fetch(`/api/admin_users?user_id=${adminUser.id}`);
                const data = await res.json();
                console.log("Admin Users Data Received:", data);
                
                if (data.error) {
                    document.getElementById('userList').innerHTML = `<div style="text-align: center; color: #ef4444; padding: 40px;">Error: ${data.error}</div>`;
                    return;
                }

                allUsers = Array.isArray(data) ? data : [];
                
                // Debugging
                const debugArea = document.getElementById('debugArea');
                const rawJSON = document.getElementById('rawJSON');
                if (allUsers.length > 0) {
                    debugArea.style.display = 'block';
                    rawJSON.innerText = JSON.stringify(allUsers[0], null, 2);
                }

                renderUsers(allUsers);
            } catch (e) {
                console.error(e);
                document.getElementById('userList').innerHTML = `<div style="text-align: center; color: #ef4444; padding: 40px;">Connection Failed</div>`;
            }
        }

        function renderUsers(users) {
            const list = document.getElementById('userList');
            if (users.length === 0) {
                list.innerHTML = `<div style="text-align: center; color: var(--text-secondary); padding: 40px;">No users found</div>`;
                return;
            }

            list.innerHTML = users.map(u => {
                const displayName = u.full_name || u.username || 'Anonymous';
                const avatarChar = displayName[0].toUpperCase();
                return `
                <div class="user-card">
                    <div class="user-avatar">${avatarChar}</div>
                    <div class="user-info">
                        <span class="user-name">${displayName}</span>
                        <span class="user-id-text">ID: ${u.user_id}</span>
                    </div>
                    <div class="user-meta">
                        <span class="user-balance">$${(u.balance || 0).toFixed(2)}</span>
                        <span class="user-date">${new Date(u.join_date || Date.now()).toLocaleDateString()}</span>
                    </div>
                </div>
                `;
            }).join('');
        }

        document.getElementById('userSearch').oninput = (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allUsers.filter(u => 
                (u.full_name && u.full_name.toLowerCase().includes(query)) || 
                (u.username && u.username.toLowerCase().includes(query)) ||
                u.user_id.toString().includes(query)
            );
            renderUsers(filtered);
        }

        loadUsers();
    </script>
</body>
</html>
