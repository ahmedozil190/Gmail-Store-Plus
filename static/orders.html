<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Orders - Gmail Store Plus</title>
    <link rel="stylesheet" href="/static/style.css?v=3.4">
    <link rel="stylesheet" href="/static/webapp.css?v=3.4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="page-title">
            <div class="page-title-inner">
                <button class="hamburger-btn" id="menuBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <span>My Orders</span>
                <div class="page-title-avatar" id="avatar">A</div>
            </div>
        </header>

        <main class="main-content">
            <div class="elite-section-header">
                <h3 class="elite-section-title">Purchase History</h3>
            </div>

            <div id="orders-list" class="elite-list">
                <div class="loading-text" style="text-align: center; padding: 20px; color: var(--text-secondary);">
                    Loading your orders...
                </div>
            </div>
        </main>
    </div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Gmail Store Plus</span>
            <button class="sidebar-close" id="closeBtn">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="/static/index.html" class="sidebar-item"><i class="fas fa-home"></i> Home</a>
            <a href="/static/orders.html" class="sidebar-item active"><i class="fas fa-shopping-cart"></i> My Orders</a>
            <a href="/static/wallet.html" class="sidebar-item"><i class="fas fa-wallet"></i> Wallet</a>
            <a href="/static/support.html" class="sidebar-item"><i class="fas fa-headset"></i> Support</a>
        </nav>
    </aside>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#15161f';
        tg.backgroundColor = '#0a0b10';

        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('avatar').innerText = (user.first_name || "A")[0].toUpperCase();
        }

        // Sidebar Logic
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');

        menuBtn.onclick = () => { sidebar.classList.add('open'); overlay.classList.add('open'); }
        closeBtn.onclick = overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

        async function loadOrders() {
            try {
                const response = await fetch(`/api/orders?user_id=${user?.id}`);
                const orders = await response.json();
                const list = document.getElementById('orders-list');
                
                if (orders.length === 0) {
                    list.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-secondary);">No orders found.</div>';
                    return;
                }

                list.innerHTML = orders.map(order => `
                    <div class="elite-card-detailed">
                        <div class="elite-row">
                            <span class="elite-label">Account:</span>
                            <span class="elite-value">${order.email}</span>
                        </div>
                        <div class="elite-row">
                            <span class="elite-label">Password:</span>
                            <span class="elite-value" onclick="copyText('${order.password}')" style="color: var(--accent-blue); cursor: pointer;">
                                ${order.password} <i class="fas fa-copy" style="font-size: 0.7rem; margin-left: 5px;"></i>
                            </span>
                        </div>
                        <div class="elite-row">
                            <span class="elite-label" style="--elite-label-width: 80px;">Paid:</span>
                            <span class="elite-value" style="color: var(--success);">$${order.price_paid}</span>
                        </div>
                        <div class="elite-row" style="margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.03); padding-top: 10px;">
                            <span class="elite-value" style="font-size: 0.75rem; color: var(--text-secondary);">
                                <i class="far fa-calendar-alt" style="margin-right: 5px;"></i> 
                                ${new Date(order.purchased_at).toLocaleString()}
                            </span>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                document.getElementById('orders-list').innerHTML = '<div style="color: var(--danger);">Error loading orders.</div>';
            }
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                tg.HapticFeedback.notificationOccurred('success');
            });
        }

        loadOrders();
    </script>

    <style>
        :root { --elite-label-width: 80px; }
        .elite-card-detailed { margin-bottom: 12px; }
    </style>
</body>
</html>
