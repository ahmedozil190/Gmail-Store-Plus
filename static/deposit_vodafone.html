<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vodafone Cash Deposit - Gmail Store Plus</title>
    <link rel="stylesheet" href="/static/style.css?v=3.6">
    <link rel="stylesheet" href="/static/webapp.css?v=3.6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .deposit-form { display: flex; flex-direction: column; gap: 20px; padding: 20px; }

        .instruction-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        .vodafone-number {
            font-size: 1.5rem;
            font-weight: 900;
            color: #ef4444;
            letter-spacing: 1px;
            margin: 10px 0;
            display: block;
        }

        .rate-info { font-size: 0.85rem; color: #fff; font-weight: 700; margin-top: 5px; opacity: 0.8; }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); margin-left: 5px; }

        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 15px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .calc-result {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 14px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-weight: 700;
            display: none;
        }
        .calc-result span.val { color: #10b981; font-size: 1.15rem; font-weight: 900; }

        .file-upload-btn {
            background: rgba(59, 130, 246, 0.1);
            border: 2px dashed rgba(59, 130, 246, 0.3);
            border-radius: 14px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
        }

        #imagePreview { width: 100%; border-radius: 14px; margin-top: 10px; display: none; }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .back-btn:active { color: #fff; transform: scale(0.9); }

        .submit-btn {
            background: var(--success);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
        }
        .submit-btn:disabled { opacity: 0.5; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="page-title">
            <div class="page-title-inner">
                <button class="back-btn" onclick="history.back()">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <span>Add Balance</span>
                <div class="page-title-avatar" id="avatar">A</div>
            </div>
        </header>

        <main class="main-content">
            <div class="deposit-form">
                <div class="instruction-card">
                    <span style="font-size: 0.85rem; color: var(--text-secondary);">Transfer amount to:</span>
                    <span class="vodafone-number" id="vNumber">010XXXXXXXX</span>
                    <div class="rate-info" id="rateLine">1$ = 0.00 EGP</div>
                </div>

                <div class="input-group">
                    <label>Deposit Amount ($)</label>
                    <input type="number" id="amount" class="input-field" placeholder="Deposit amount $ (USD)" step="1">
                </div>

                <div class="calc-result" id="calcBox">
                    <span>Pay in EGP:</span>
                    <span class="val" id="egpTotal">0.00 EGP</span>
                </div>

                <div class="input-group">
                    <label>Sender Phone Number</label>
                    <input type="tel" id="senderPhone" class="input-field" placeholder="e.g. 010XXXXXXXX" maxlength="11">
                </div>

                <div class="input-group">
                    <label>Transfer Proof</label>
                    <label for="imageInput" class="file-upload-btn">
                        <i class="fas fa-camera"></i>
                        <span id="uploadStatus">Tap to upload proof</span>
                    </label>
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    <img id="imagePreview" src="">
                </div>

                <button class="submit-btn" id="submitBtn">Send Request</button>
            </div>
        </main>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const user = tg.initDataUnsafe.user;
        if (user) document.getElementById('avatar').innerText = (user.first_name || "A")[0].toUpperCase();

        let exchangeRate = 0;

        async function initPage() {
             try {
                const response = await fetch(`/api/user_data?user_id=${user?.id}`);
                const data = await response.json();
                if (data.vodafone_number) {
                    document.getElementById('vNumber').innerText = data.vodafone_number;
                    exchangeRate = data.exchange_rate || 52.7;
                    document.getElementById('rateLine').innerText = `1$ = ${exchangeRate.toFixed(2)} EGP`;
                }
            } catch (e) { 
                console.error(e);
                exchangeRate = 52.70;
                document.getElementById('rateLine').innerText = `1$ = ${exchangeRate.toFixed(2)} EGP`;
            }
        }

        const amountInput = document.getElementById('amount');
        const calcBox = document.getElementById('calcBox');
        const egpTotal = document.getElementById('egpTotal');

        amountInput.oninput = () => {
            const val = parseFloat(amountInput.value);
            if (val > 0 && exchangeRate > 0) {
                calcBox.style.display = 'flex';
                egpTotal.innerText = (val * exchangeRate).toFixed(2) + ' EGP';
            } else {
                calcBox.style.display = 'none';
            }
        };

        const imgInput = document.getElementById('imageInput');
        const imgPreview = document.getElementById('imagePreview');
        const uploadStatus = document.getElementById('uploadStatus');
        const submitBtn = document.getElementById('submitBtn');

        imgInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (re) => {
                    imgPreview.src = re.target.result;
                    imgPreview.style.display = 'block';
                    uploadStatus.innerText = 'Screenshot ready';
                };
                reader.readAsDataURL(file);
            }
        };

        submitBtn.onclick = async () => {
            const amount = amountInput.value;
            const file = imgInput.files[0];
            const senderPhone = document.getElementById('senderPhone').value.trim();

            if (!amount || amount < 1) {
                tg.showAlert('Minimum is $1.00');
                return;
            }
            if (!senderPhone || senderPhone.length < 10) {
                tg.showAlert('Please enter the phone number you sent from');
                return;
            }
            if (!file) {
                tg.showAlert('Proof image required');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Verifying...';

            const formData = new FormData();
            formData.append('user_id', user.id);
            formData.append('amount', amount);
            formData.append('sender_phone', senderPhone);
            formData.append('proof', file);

            try {
                const res = await fetch('/api/manual_deposit', { method: 'POST', body: formData });
                const result = await res.json();
                if (result.success) {
                    tg.showPopup({ title: 'Sent!', message: 'Admin will review and update your balance.', buttons: [{type: 'ok'}] }, () => {
                        window.location.href = '/static/wallet.html';
                    });
                } else { tg.showAlert('Error: ' + result.error); }
            } catch (e) { tg.showAlert('Network error'); }
            finally { submitBtn.disabled = false; submitBtn.innerText = 'Send Request'; }
        };

        initPage();
    </script>
</body>
</html>
