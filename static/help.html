<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Help - Gmail Store Plus</title>
    <link rel="stylesheet" href="/static/style.css?v=3.5">
    <link rel="stylesheet" href="/static/webapp.css?v=3.5">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="page-title">
            <div class="page-title-inner">
                <button class="hamburger-btn" id="menuBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <span>Help</span>
                <div class="page-title-avatar" id="avatar">A</div>
            </div>
        </header>

        <main class="main-content">
            <div class="hero-action-card">
                <div class="hero-icon-wrapper">
                    <i class="fas fa-headset"></i>
                </div>
                <h2 class="hero-title">How can we help?</h2>
                <p class="hero-subtitle">Our technical support team is available 24/7 to assist you via Telegram.</p>
                <a href="#" onclick="tg.openTelegramLink('https://t.me/A_M_E_15'); return false;" class="btn-hero">
                    <i class="fab fa-telegram-plane"></i> Contact Support
                </a>
            </div>

            <div class="elite-section-header" style="margin-top: 20px;">
                <h3 class="elite-section-title">Join Our Community</h3>
            </div>
            
            <div class="elite-grid">
                <a href="#" onclick="tg.openTelegramLink('https://t.me/A_M_E_15'); return false;" class="elite-card">
                    <i class="fas fa-bullhorn" style="color: var(--warning);"></i>
                    <div class="info">
                        <span class="title">Official Channel</span>
                        <span class="desc">Get latest updates and news.</span>
                    </div>
                    <i class="fas fa-external-link-alt" style="margin-left: auto; font-size: 0.8rem; color: var(--text-secondary);"></i>
                </a>
            </div>

        </main>
        <footer class="bot-footer">@GmailStore6346Bot</footer>
    </div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Gmail Store Plus</span>
            <button class="sidebar-close" id="closeBtn">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="/static/index.html" class="sidebar-item"><i class="fas fa-home"></i> Home</a>
            <a href="/static/orders.html" class="sidebar-item"><i class="fas fa-shopping-cart"></i> My Orders</a>
            <a href="/static/wallet.html" class="sidebar-item"><i class="fas fa-wallet"></i> Wallet</a>
            <a href="/static/help.html" class="sidebar-item active"><i class="fas fa-headset"></i> Help</a>
        </nav>
    </aside>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#232e3c';
        tg.backgroundColor = '#232e3c';

        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('avatar').innerText = (user.first_name || "A")[0].toUpperCase();
        }

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');

        menuBtn.onclick = () => { sidebar.classList.add('open'); overlay.classList.add('open'); }
        closeBtn.onclick = overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
    </script>
</body>
</html>
