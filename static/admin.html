<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/static/style.css?v=3.6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .admin-section-header {
            margin-top: 30px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-section-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .refresh-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 12px;
            border-radius: 16px;
            width: 100%;
            font-weight: 600;
            margin: 20px 0 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }
        .refresh-btn:active { transform: scale(0.98); background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo" style="color: var(--warning);">Admin Console</span>
                <button class="close-sidebar" id="closeBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="sidebar-nav">
                <a href="/admin_panel" class="sidebar-item active">
                    <i class="fas fa-chart-pie"></i> <span>Dashboard</span>
                </a>
                <a href="/admin_users" class="sidebar-item">
                    <i class="fas fa-users-cog"></i> <span>Manage Users</span>
                </a>
                <a href="/admin_inventory" class="sidebar-item">
                    <i class="fas fa-box-open"></i> <span>Inventory</span>
                </a>
                <a href="/admin_deposits" class="sidebar-item">
                    <i class="fas fa-file-invoice-dollar"></i> <span>Deposits</span>
                </a>
                <a href="/" class="sidebar-item" style="opacity: 0.7; margin-top: 10px;">
                    <i class="fas fa-sign-out-alt"></i> <span>Exit Admin</span>
                </a>
            </div>
        </nav>
        <div class="sidebar-overlay" id="overlay"></div>

        <!-- Header -->
        <header class="page-title">
            <div class="page-title-inner">
                <button class="hamburger-btn" id="menuBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <span>Admin Panel</span>
                <div class="page-title-avatar" id="avatar">A</div>
            </div>
        </header>

        <main class="main-content">
            <!-- Consolidate Stats Card -->
            <div class="glass-card stat-card-multi">
                <div class="stat-row">
                    <span class="stat-label">Total Users</span>
                    <span class="stat-value blue" id="stats-users">--</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-row">
                    <span class="stat-label">Total Balance</span>
                    <span class="stat-value green" id="stats-balance">--</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-row">
                    <span class="stat-label">In Stock</span>
                    <span class="stat-value orange" id="stats-stock">--</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-row">
                    <span class="stat-label">Total Orders</span>
                    <span class="stat-value" id="stats-orders">--</span>
                </div>
            </div>

            <div class="admin-section-header">
                <i class="fas fa-chart-line" style="color: #8b5cf6;"></i>
                <h3>Advanced Metrics</h3>
            </div>

            <div class="glass-card stat-card-multi">
                <div class="stat-row">
                    <span class="stat-label">Accounts Sold</span>
                    <span id="stats-sold" class="stat-value green">--</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-row">
                    <span class="stat-label">Pending Deposits</span>
                    <span id="stats-pending" class="stat-value" style="color: #ef4444;">--</span>
                </div>
            </div>
            
            <button class="refresh-btn" onclick="loadAdminStats()">
                <i class="fas fa-sync-alt"></i> Refresh Dashboard
            </button>
        </main>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#232e3c';
        tg.backgroundColor = '#232e3c';

        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('avatar').innerText = (user.first_name || "A")[0].toUpperCase();
        }

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');

        menuBtn.onclick = () => { sidebar.classList.add('open'); overlay.classList.add('open'); }
        closeBtn.onclick = overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

        async function loadAdminStats() {
            try {
                const res = await fetch(`/api/admin_stats?user_id=${user?.id}`);
                const stats = await res.json();

                if (stats.error) {
                    console.error("Auth Error:", stats.error);
                    return;
                }

                document.getElementById('stats-users').innerText = stats.total_users;
                document.getElementById('stats-balance').innerText = `$${stats.total_balance.toFixed(2)}`;
                document.getElementById('stats-stock').innerText = stats.available_accounts;
                document.getElementById('stats-orders').innerText = stats.total_orders;
                document.getElementById('stats-sold').innerText = stats.sold_accounts;
                document.getElementById('stats-pending').innerText = stats.pending_deposits;

                tg.HapticFeedback.impactOccurred('light');
            } catch (e) {
                console.error(e);
            }
        }

        loadAdminStats();
    </script>
</body>
</html>
