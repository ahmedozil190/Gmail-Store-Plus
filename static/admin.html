<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/static/style.css?v=1.7">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .admin-card {
            background: var(--card-bg);
            padding: 18px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            text-align: center;
        }
        .admin-card h4 {
            color: var(--secondary);
            font-size: 0.8rem;
            margin-bottom: 8px;
        }
        .admin-card .val {
            font-size: 1.4rem;
            font-weight: 700;
            color: #10b981;
        }
    </style>
</head>
<body>
    <div class="header-v2">
        <div class="header-title">Admin Panel</div>
        <div class="status-badge" style="background: rgba(56, 189, 248, 0.1); color: var(--secondary); padding: 5px 12px; border-radius: 20px; font-size: 0.75rem;">Admin Access</div>
    </div>

    <div class="admin-grid">
        <div class="admin-card">
            <h4>Total Users</h4>
            <div class="val" id="users-count">0</div>
        </div>
        <div class="admin-card">
            <h4>In Stock</h4>
            <div class="val" id="acc-count">0</div>
        </div>
        <div class="admin-card">
            <h4>Total Sales</h4>
            <div class="val" id="total-sales">$0</div>
        </div>
        <div class="admin-card">
            <h4>Pending Req.</h4>
            <div class="val" id="pending-count">0</div>
        </div>
    </div>

    <div class="section-header">
        <div class="section-title">Quick Management</div>
    </div>
    
    <div id="deposit-requests">
        <div style="text-align: center; color: var(--text-muted); padding: 30px; background: var(--card-bg); border-radius: 20px;">
            No pending deposit requests.
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#0f172a';

        async function loadAdminStats() {
            document.getElementById('users-count').innerText = "142";
            document.getElementById('acc-count').innerText = "85";
            document.getElementById('total-sales').innerText = "$542.5";
        }

        loadAdminStats();
    </script>
</body>
</html>
