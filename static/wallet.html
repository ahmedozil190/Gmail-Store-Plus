<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Wallet - Gmail Store Plus</title>
    <link rel="stylesheet" href="/static/style.css?v=3.8">
    <link rel="stylesheet" href="/static/webapp.css?v=3.8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .history-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
        .history-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-info { display: flex; flex-direction: column; gap: 4px; }
        .history-method { font-size: 0.9rem; font-weight: 700; color: #fff; }
        .history-date { font-size: 0.7rem; color: var(--text-secondary); }
        .history-right { text-align: right; }
        .history-amount { font-size: 1rem; font-weight: 800; color: #fff; display: block; }
        .history-status { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; }
        .history-status.pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .history-status.approved { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .history-status.rejected { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="wa-header">
            <div class="wa-avatar" id="avatar">A</div>
            <div class="wa-info">
                <div class="wa-username" id="userName">User</div>
                <div class="wa-greeting">Manage your balance</div>
            </div>
        </header>

        <main class="main-content" style="padding-top: 20px;">
            <div class="glass-card balance-card">
                <div class="balance-label">Total Balance</div>
                <div class="balance-amount">$<span id="balance">0.00</span></div>
            </div>

            <div class="elite-section-header" style="margin-top: 20px;">
                <span class="elite-section-title">Deposit Methods</span>
            </div>

            <div class="elite-grid">
                <div class="elite-card" id="cryptoBtn">
                    <i class="fas fa-bitcoin-sign" style="color: #f59e0b;"></i>
                    <div class="info">
                        <span class="title">Cryptocurrency (Auto)</span>
                    </div>
                    <i class="fas fa-chevron-right" style="margin-left: auto; font-size: 0.8rem; color: var(--text-secondary);"></i>
                </div>

                <div class="elite-card" id="vodafoneBtn">
                    <i class="fas fa-mobile-screen-button" style="color: #ef4444;"></i>
                    <div class="info">
                        <span class="title">Vodafone Cash</span>
                    </div>
                    <i class="fas fa-chevron-right" style="margin-left: auto; font-size: 0.8rem; color: var(--text-secondary);"></i>
                </div>
            </div>

            <div class="elite-section-header" style="margin-top: 30px;">
                <span class="elite-section-title">Transaction History</span>
                <i class="fas fa-clock-rotate-left" style="color: var(--text-secondary); opacity: 0.5;"></i>
            </div>

            <div class="history-list" id="historyList">
                <div class="empty-state">
                    <i class="fas fa-receipt"></i>
                    No transactions yet.
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="/static/index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="/static/shop.html" class="nav-item">
                <i class="fas fa-shopping-bag"></i>
                <span>Shop</span>
            </a>
            <a href="/static/wallet.html" class="nav-item active">
                <i class="fas fa-wallet"></i>
                <span>Wallet</span>
            </a>
            <a href="/static/orders.html" class="nav-item">
                <i class="fas fa-history"></i>
                <span>Orders</span>
            </a>
            <a href="/static/help.html" class="nav-item">
                <i class="fas fa-question-circle"></i>
                <span>Help</span>
            </a>
        </nav>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe.user;

        if (user) {
            document.getElementById('userName').innerText = user.first_name;
            document.getElementById('avatar').innerText = user.first_name[0].toUpperCase();
        }

        async function loadData() {
            try {
                const userId = user?.id || 7142953055;
                const [userRes, historyRes] = await Promise.all([
                    fetch(`/api/user_data?user_id=${userId}`),
                    fetch(`/api/user_deposits?user_id=${userId}`)
                ]);
                
                const userData = await userRes.json();
                document.getElementById('balance').innerText = userData.balance.toFixed(2);

                const history = await historyRes.json();
                renderHistory(history);
            } catch (e) {
                console.error("Error loading wallet data:", e);
            }
        }

        function renderHistory(items) {
            const list = document.getElementById('historyList');
            if (items.length === 0) return;

            list.innerHTML = '';
            items.forEach(item => {
                const date = new Date(item.created_at).toLocaleDateString('en-GB', {
                    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
                });
                
                const card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <div class="history-info">
                        <span class="history-method">${item.method}</span>
                        <span class="history-date">${date}</span>
                    </div>
                    <div class="history-right">
                        <span class="history-amount">+$${item.amount.toFixed(2)}</span>
                        <span class="history-status ${item.status}">${item.status}</span>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        document.getElementById('cryptoBtn').onclick = () => {
            window.location.href = '/static/deposit_crypto.html';
        };

        document.getElementById('vodafoneBtn').onclick = () => {
            window.location.href = '/static/deposit_vodafone.html';
        };

        loadData();
    </script>
</body>
</html>
