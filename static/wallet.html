<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Wallet - Gmail Store Plus</title>
    <link rel="stylesheet" href="/static/style.css?v=3.9">
    <link rel="stylesheet" href="/static/webapp.css?v=3.9">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .history-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
        .history-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-info { display: flex; flex-direction: column; gap: 4px; }
        .history-method { font-size: 0.9rem; font-weight: 700; color: #fff; }
        .history-date { font-size: 0.7rem; color: var(--text-secondary); }
        .history-right { text-align: right; }
        .history-amount { font-size: 1rem; font-weight: 800; color: #fff; display: block; }
        .history-status { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; }
        .history-status.pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .history-status.approved { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .history-status.rejected { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .history-amount.neg { color: #ef4444; }
        .history-amount.pos { color: #10b981; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header (Same as other pages) -->
        <header class="page-title">
            <div class="page-title-inner">
                <button class="hamburger-btn" id="menuBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <span>Wallet</span>
                <div class="page-title-avatar" id="avatar">A</div>
            </div>
        </header>

        <main class="main-content">
            <div class="glass-card balance-card">
                <div class="balance-label">Total Balance</div>
                <div class="balance-amount">$<span id="balance">0.00</span></div>
            </div>

            <div class="elite-section-header" style="margin-top: 20px;">
                <span class="elite-section-title">Deposit Methods</span>
            </div>

            <div class="elite-grid">
                <div class="elite-card" id="cryptoBtn">
                    <i class="fas fa-bitcoin-sign" style="color: #f59e0b;"></i>
                    <div class="info">
                        <span class="title">Cryptocurrency (Auto)</span>
                    </div>
                    <i class="fas fa-chevron-right" style="margin-left: auto; font-size: 0.8rem; color: var(--text-secondary);"></i>
                </div>

                <div class="elite-card" id="vodafoneBtn">
                    <i class="fas fa-mobile-screen-button" style="color: #ef4444;"></i>
                    <div class="info">
                        <span class="title">Vodafone Cash</span>
                    </div>
                    <i class="fas fa-chevron-right" style="margin-left: auto; font-size: 0.8rem; color: var(--text-secondary);"></i>
                </div>
            </div>

            <div class="elite-section-header" style="margin-top: 30px;">
                <span class="elite-section-title">Transaction History</span>
                <i class="fas fa-clock-rotate-left" style="color: var(--text-secondary); opacity: 0.5;"></i>
            </div>

            <div class="history-list" id="historyList">
                <div class="empty-state">
                    <i class="fas fa-receipt"></i>
                    No transactions yet.
                </div>
            </div>
        </main>
        <footer class="bot-footer">@GmailStore6346Bot</footer>
    </div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Gmail Store Plus</span>
            <button class="sidebar-close" id="closeBtn">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="/static/index.html" class="sidebar-item"><i class="fas fa-home"></i> Home</a>
            <a href="/static/shop.html" class="sidebar-item"><i class="fas fa-shopping-bag"></i> Shop</a>
            <a href="/static/orders.html" class="sidebar-item"><i class="fas fa-shopping-cart"></i> My Orders</a>
            <a href="/static/wallet.html" class="sidebar-item active"><i class="fas fa-wallet"></i> Wallet</a>
            <a href="/static/help.html" class="sidebar-item"><i class="fas fa-headset"></i> Help</a>
        </nav>
    </aside>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#232e3c';
        tg.backgroundColor = '#232e3c';

        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('avatar').innerText = (user.first_name || "A")[0].toUpperCase();
        }

        // Sidebar Logic
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');

        menuBtn.onclick = () => { sidebar.classList.add('open'); overlay.classList.add('open'); }
        closeBtn.onclick = overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

        async function loadData() {
            try {
                const userId = user?.id || 7142953055;
                const [userRes, historyRes] = await Promise.all([
                    fetch(`/api/user_data?user_id=${userId}`),
                    fetch(`/api/user_deposits?user_id=${userId}`)
                ]);
                
                const userData = await userRes.json();
                document.getElementById('balance').innerText = userData.balance.toFixed(2);

                const history = await historyRes.json();
                renderHistory(history);
            } catch (e) {
                console.error("Error loading wallet data:", e);
            }
        }

        function renderHistory(items) {
            const list = document.getElementById('historyList');
            if (items.length === 0) return;

            list.innerHTML = '';
            items.forEach(item => {
                const isDeposit = item.type === 'deposit';
                const method = isDeposit ? (item.method || 'Deposit') : 'Account Purchase';
                const amountPrefix = isDeposit ? '+' : '-';
                const amountClass = isDeposit ? 'pos' : 'neg';
                
                const date = new Date(item.created_at).toLocaleDateString('en-GB', {
                    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
                });
                
                const card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <div class="history-info">
                        <span class="history-method">${method}</span>
                        <span class="history-date">${date}</span>
                    </div>
                    <div class="history-right">
                        <span class="history-amount ${amountClass}">${amountPrefix}$${item.amount.toFixed(2)}</span>
                        ${isDeposit ? `<span class="history-status ${item.status}">${item.status}</span>` : '<span class="history-status approved">Success</span>'}
                    </div>
                `;
                list.appendChild(card);
            });
        }

        document.getElementById('cryptoBtn').onclick = () => {
            window.location.href = '/static/deposit_crypto.html';
        };

        document.getElementById('vodafoneBtn').onclick = () => {
            window.location.href = '/static/deposit_vodafone.html';
        };

        loadData();
    </script>
</body>
</html>
