<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shop - Gmail Store Plus</title>
    <link rel="stylesheet" href="/static/style.css?v=3.6">
    <link rel="stylesheet" href="/static/webapp.css?v=3.6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Custom Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-content {
            background: #232e3c;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            transform: scale(0.9);
            transition: all 0.3s;
        }
        .modal-overlay.open .modal-content { transform: scale(1); }
        .modal-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .modal-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .modal-text {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-cancel { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-confirm { background: var(--accent-blue); color: #fff; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="page-title">
            <div class="page-title-inner">
                <button class="hamburger-btn" id="menuBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <span>Shop</span>
                <div class="page-title-avatar" id="avatar">A</div>
            </div>
        </header>

        <main class="main-content">
            <div class="hero-action-card">
                <div id="stock-container">
                    <span class="stock-badge" id="stock-badge">Checking stock...</span>
                </div>
                
                <div class="hero-icon-wrapper">
                    <i class="fas fa-envelope"></i>
                </div>
                
                <h2 class="hero-title" id="product-name">Gmail Accounts</h2>
                <p class="hero-subtitle" id="product-desc">High quality accounts with recovery email.</p>
                
                <div style="color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; margin-bottom: 5px;" id="unit-price-label">Price: $0.00 / Account</div>
                <div class="shop-price-tag" id="total-price">--</div>
                
                <div class="qty-selector">
                    <button class="qty-btn" id="minusBtn"><i class="fas fa-minus-circle"></i></button>
                    <input type="number" class="qty-input" id="qtyInput" value="1" min="1">
                    <button class="qty-btn" id="plusBtn"><i class="fas fa-plus-circle"></i></button>
                </div>

                <button class="btn-hero" id="buyBtn">
                    <i class="fas fa-shopping-cart"></i> Buy Now
                </button>
            </div>
        </main>
    </div>

    <!-- Custom Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon"></div>
            <div class="modal-title" id="modalTitle">Title</div>
            <div class="modal-text" id="modalText">Message</div>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" id="modalCancel">Cancel</button>
                <button class="modal-btn btn-confirm" id="modalConfirm">OK</button>
            </div>
        </div>
    </div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Gmail Store Plus</span>
            <button class="sidebar-close" id="closeBtn">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="/static/index.html" class="sidebar-item"><i class="fas fa-home"></i> Home</a>
            <a href="/static/shop.html" class="sidebar-item active"><i class="fas fa-shopping-bag"></i> Shop</a>
            <a href="/static/orders.html" class="sidebar-item"><i class="fas fa-shopping-cart"></i> My Orders</a>
            <a href="/static/wallet.html" class="sidebar-item"><i class="fas fa-wallet"></i> Wallet</a>
            <a href="/static/help.html" class="sidebar-item"><i class="fas fa-headset"></i> Help</a>
        </nav>
    </aside>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#232e3c';
        tg.backgroundColor = '#232e3c';

        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('avatar').innerText = (user.first_name || "A")[0].toUpperCase();
        }

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');

        menuBtn.onclick = () => { sidebar.classList.add('open'); overlay.classList.add('open'); }
        closeBtn.onclick = overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

        let unitPrice = 0;
        let currentStock = 0;
        let userBalance = 0;

        // Modal Logic
        const modalOverlay = document.getElementById('modalOverlay');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        const modalCancel = document.getElementById('modalCancel');
        const modalConfirm = document.getElementById('modalConfirm');

        function showModal(title, text, type, confirmText, callback) {
            modalTitle.innerText = title;
            modalText.innerText = text;
            modalConfirm.innerText = confirmText || 'OK';
            
            modalCancel.innerText = 'Cancel';
            if (type === 'error') {
                modalIcon.innerHTML = '<i class="fas fa-exclamation-circle" style="color: var(--warning);"></i>';
                modalCancel.style.display = 'none';
            } else if (type === 'confirm') {
                modalIcon.innerHTML = '<i class="fas fa-question-circle" style="color: var(--accent-blue);"></i>';
                modalCancel.style.display = 'block';
            } else if (type === 'success') {
                modalIcon.innerHTML = '<i class="fas fa-check-circle" style="color: var(--success);"></i>';
                modalCancel.style.display = 'none';
            }

            modalOverlay.classList.add('open');
            modalConfirm.onclick = () => {
                modalOverlay.classList.remove('open');
                if (callback) callback();
            };
            modalCancel.onclick = () => {
                modalOverlay.classList.remove('open');
            };
        }

        async function loadShopData() {
            try {
                const [shopRes, userRes] = await Promise.all([
                    fetch('/api/shop_data'),
                    fetch(`/api/user_data?user_id=${user?.id}`)
                ]);
                
                const shopData = await shopRes.json();
                const userData = await userRes.json();

                unitPrice = parseFloat(shopData.price) || 0;
                currentStock = parseInt(shopData.stock) || 0;
                userBalance = parseFloat(userData.balance) || 0;

                console.log(`Data Loaded: Price=${unitPrice}, Stock=${currentStock}, Balance=${userBalance}`);

                document.getElementById('product-name').innerText = shopData.product_name || "Gmail Accounts";
                document.getElementById('product-desc').innerText = shopData.product_desc || "High quality accounts.";
                document.getElementById('unit-price-label').innerText = `Price: $${unitPrice.toFixed(2)} / Account`;
                
                const badge = document.getElementById('stock-badge');
                badge.innerText = `${currentStock} In Stock`;
                if(currentStock < 10) badge.classList.add('low');

                updateTotal();
            } catch (e) { 
                console.error(e);
                document.getElementById('stock-badge').innerText = "Stock Unavailable";
            }
        }

        const qtyInput = document.getElementById('qtyInput');
        function updateTotal() {
            let qty = parseInt(qtyInput.value) || 1;
            if (qty < 1) qty = 1;
            qtyInput.value = qty;
            
            const total = (qty * unitPrice).toFixed(2);
            document.getElementById('total-price').innerText = `$${total}`;
        }

        qtyInput.oninput = () => {
            updateTotal();
        };

        document.getElementById('plusBtn').onclick = () => {
            let val = parseInt(qtyInput.value) || 1;
            qtyInput.value = val + 1;
            updateTotal();
        };

        document.getElementById('minusBtn').onclick = () => {
            let val = parseInt(qtyInput.value) || 1;
            qtyInput.value = val - 1;
            updateTotal();
        };

        document.getElementById('buyBtn').onclick = () => {
            const qty = parseInt(qtyInput.value) || 1;
            const totalVal = parseFloat((qty * unitPrice).toFixed(2));
            const totalStr = totalVal.toFixed(2);
            
            console.log(`Buy Step 1: Qty=${qty}, Total=${totalVal}, Balance=${userBalance}, Stock=${currentStock}`);

            if (totalVal > userBalance) {
                console.log("Showing Balance Error Modal");
                showModal('Balance Error', `Insufficient balance. You need $${totalStr} but you have $${userBalance.toFixed(2)}.`, 'error', 'Close');
                return;
            }

            if (qty > currentStock) {
                console.log("Showing Stock Error Modal");
                showModal('Stock Error', `Sorry, only ${currentStock} accounts available.`, 'error', 'Close');
                return;
            }

            console.log("Showing Confirm Modal");
            showModal('Confirm Purchase', `Buy ${qty} accounts for $${totalStr}?`, 'confirm', 'Buy Now', () => {
                tg.sendData(JSON.stringify({action: 'buy', qty: qty}));
            });
        };

        loadShopData();
    </script>
</body>
</html>
