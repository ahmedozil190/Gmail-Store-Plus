<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shop - Gmail Store Plus</title>
    <link rel="stylesheet" href="/static/style.css?v=3.6">
    <link rel="stylesheet" href="/static/webapp.css?v=3.6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="page-title">
            <div class="page-title-inner">
                <button class="hamburger-btn" id="menuBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <span>Shop</span>
                <div class="page-title-avatar" id="avatar">A</div>
            </div>
        </header>

        <main class="main-content">
            <div class="hero-action-card">
                <div id="stock-container">
                    <span class="stock-badge" id="stock-badge">Checking stock...</span>
                </div>
                
                <div class="hero-icon-wrapper">
                    <i class="fas fa-envelope"></i>
                </div>
                
                <h2 class="hero-title" id="product-name">Gmail Accounts</h2>
                <p class="hero-subtitle" id="product-desc">High quality accounts with recovery email.</p>
                
                <div style="color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; margin-bottom: 5px;" id="unit-price-label">Price: $0.00 / Account</div>
                <div class="shop-price-tag" id="total-price">--</div>
                
                <div class="qty-selector">
                    <button class="qty-btn" id="minusBtn"><i class="fas fa-minus"></i></button>
                    <input type="number" class="qty-input" id="qtyInput" value="1" min="1">
                    <button class="qty-btn" id="plusBtn"><i class="fas fa-plus"></i></button>
                </div>

                <button class="btn-hero" id="buyBtn">
                    <i class="fas fa-shopping-cart"></i> Buy Now
                </button>
            </div>

            <div class="glass-card" style="padding: 15px; border-radius: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="color: var(--text-secondary); font-weight: 500;">Your Balance</span>
                    <span style="color: var(--success); font-weight: 800;" id="user-balance">$0.00</span>
                </div>
            </div>
        </main>
        <footer class="bot-footer">@GmailStore6346Bot</footer>
    </div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Gmail Store Plus</span>
            <button class="sidebar-close" id="closeBtn">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="/static/index.html" class="sidebar-item"><i class="fas fa-home"></i> Home</a>
            <a href="/static/shop.html" class="sidebar-item active"><i class="fas fa-shopping-bag"></i> Shop</a>
            <a href="/static/orders.html" class="sidebar-item"><i class="fas fa-shopping-cart"></i> My Orders</a>
            <a href="/static/wallet.html" class="sidebar-item"><i class="fas fa-wallet"></i> Wallet</a>
            <a href="/static/help.html" class="sidebar-item"><i class="fas fa-headset"></i> Help</a>
        </nav>
    </aside>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#232e3c';
        tg.backgroundColor = '#232e3c';

        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('avatar').innerText = (user.first_name || "A")[0].toUpperCase();
        }

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');

        menuBtn.onclick = () => { sidebar.classList.add('open'); overlay.classList.add('open'); }
        closeBtn.onclick = overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

        let unitPrice = 0;
        let currentStock = 0;

        async function loadShopData() {
            try {
                const [shopRes, userRes] = await Promise.all([
                    fetch('/api/shop_data'),
                    fetch(`/api/user_data?user_id=${user?.id}`)
                ]);
                
                const shopData = await shopRes.json();
                const userData = await userRes.json();

                unitPrice = shopData.price;
                currentStock = shopData.stock;

                document.getElementById('product-name').innerText = shopData.product_name || "Gmail Accounts";
                document.getElementById('product-desc').innerText = shopData.product_desc || "High quality accounts.";
                document.getElementById('unit-price-label').innerText = `Price: $${unitPrice.toFixed(2)} / Account`;
                
                if (userData && userData.balance !== undefined) {
                    document.getElementById('user-balance').innerText = `$${userData.balance.toFixed(2)}`;
                }
                
                const badge = document.getElementById('stock-badge');
                badge.innerText = `${currentStock} In Stock`;
                if(currentStock < 10) badge.classList.add('low');

                updateTotal();
            } catch (e) { 
                console.error(e);
                document.getElementById('stock-badge').innerText = "Stock Unavailable";
            }
        }

        const qtyInput = document.getElementById('qtyInput');
        function updateTotal() {
            let qty = parseInt(qtyInput.value) || 1;
            if (qty < 1) qty = 1;
            if (currentStock > 0 && qty > currentStock) qty = currentStock;
            qtyInput.value = qty;
            
            const total = (qty * unitPrice).toFixed(2);
            document.getElementById('total-price').innerText = `$${total}`;
        }

        qtyInput.oninput = () => {
            updateTotal();
        };

        document.getElementById('plusBtn').onclick = () => {
            let val = parseInt(qtyInput.value);
            if(val < currentStock) {
                qtyInput.value = val + 1;
                updateTotal();
            } else {
                tg.HapticFeedback.notificationOccurred('error');
            }
        };

        document.getElementById('minusBtn').onclick = () => {
            let val = parseInt(qtyInput.value);
            if(val > 1) {
                qtyInput.value = val - 1;
                updateTotal();
            }
        };

        document.getElementById('buyBtn').onclick = () => {
            const qty = parseInt(qtyInput.value);
            const total = (qty * unitPrice).toFixed(2);
            
            tg.showConfirm(`Confirm purchase of ${qty} accounts for $${total}?`, (confirmed) => {
                if(confirmed) {
                    tg.sendData(JSON.stringify({action: 'buy', qty: qty}));
                    tg.close();
                }
            });
        };

        loadShopData();
    </script>
</body>
</html>
