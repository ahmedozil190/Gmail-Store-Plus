<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deposits - Admin Console</title>
    <link rel="stylesheet" href="/static/style.css?v=3.9">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --glass-bg: rgba(26, 34, 48, 0.85);
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --glass-blur: blur(12px);
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
        }

        .deposit-list { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        
        .deposit-card-premium {
            background: var(--glass-bg);
            border: var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: var(--glass-blur);
        }

        .dep-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .dep-amount { font-size: 1.5rem; font-weight: 900; color: var(--accent-green); }
        .dep-status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .status-pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .status-approved { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .status-rejected { background: rgba(239, 68, 68, 0.1); color: #ef4444; }

        .dep-info { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 15px; }
        .dep-info p { margin-bottom: 6px; }
        .dep-info strong { color: #fff; font-weight: 600; }

        .btn-view-proof {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
            padding: 8px 15px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 15px;
            text-decoration: none;
        }

        .dep-actions { display: flex; gap: 10px; }
        .action-btn {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .btn-approve { background: var(--accent-green); color: #fff; }
        .btn-reject { background: rgba(255,255,255,0.05); color: #fff; }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ── Image Modal ── */
        .img-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        .img-modal-overlay.open { display: flex; }
        .img-modal-overlay img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 16px;
            object-fit: contain;
        }
        .img-modal-close {
            margin-top: 18px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* ── Confirm Modal ── */
        .confirm-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(8px);
        }
        .confirm-modal-overlay.open { display: flex; }
        .confirm-card {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .confirm-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 12px; color: #fff; }
        .confirm-msg { font-size: 1rem; color: var(--text-secondary); margin-bottom: 25px; line-height: 1.5; }
        .confirm-btns { display: flex; gap: 12px; }
        .confirm-btn {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .btn-no { background: rgba(255,255,255,0.05); color: #fff; }
        .btn-yes { background: var(--accent-green); color: #fff; }
        .btn-yes.reject { background: #ef4444; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo" style="color: var(--warning);">Admin Console</span>
                <button class="close-sidebar" id="closeBtn"><i class="fas fa-times"></i></button>
            </div>
            <div class="sidebar-nav">
                <a href="/admin_panel" class="sidebar-item">
                    <i class="fas fa-chart-pie"></i> <span>Dashboard</span>
                </a>
                <a href="/admin_users" class="sidebar-item">
                    <i class="fas fa-users-cog"></i> <span>Manage Users</span>
                </a>
                <a href="/admin_inventory" class="sidebar-item">
                    <i class="fas fa-box-open"></i> <span>Inventory</span>
                </a>
                <a href="/admin_deposits" class="sidebar-item active">
                    <i class="fas fa-file-invoice-dollar"></i> <span>Deposits</span>
                </a>
                <a href="/" class="sidebar-item" style="opacity: 0.7;">
                    <i class="fas fa-sign-out-alt"></i> <span>Exit Admin</span>
                </a>
            </div>
        </nav>
        <div class="sidebar-overlay" id="overlay"></div>

        <header class="page-title">
            <div class="page-title-inner">
                <button class="hamburger-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
                <span>Financial Requests</span>
                <div class="page-title-avatar" id="avatar">A</div>
            </div>
        </header>

        <main class="main-content">
            <div class="deposit-list" id="depositList">
                <div style="text-align: center; color: var(--text-secondary); padding: 40px;">
                    <i class="fas fa-spinner fa-spin"></i> Loading...
                </div>
            </div>
        </main>
    </div>

    <!-- Image Modal -->
    <div class="img-modal-overlay" id="imgModal">
        <img id="modalImg" src="" alt="Receipt">
        <button class="img-modal-close" onclick="closeModal()"><i class="fas fa-times"></i> Close</button>
    </div>

    <!-- Confirm Modal -->
    <div class="confirm-modal-overlay" id="confirmModal">
        <div class="confirm-card">
            <h3 class="confirm-title" id="confirmTitle">Confirm Action</h3>
            <p class="confirm-msg" id="confirmMsg">Are you sure you want to proceed?</p>
            <div class="confirm-btns">
                <button class="confirm-btn btn-no" id="confirmNo">Cancel</button>
                <button class="confirm-btn btn-yes" id="confirmYes">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const adminUser = tg.initDataUnsafe.user;
        if (adminUser) document.getElementById('avatar').innerText = (adminUser.first_name || "A")[0].toUpperCase();

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');

        menuBtn.onclick = () => { sidebar.classList.add('open'); overlay.classList.add('open'); }
        closeBtn.onclick = overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

        async function loadDeposits() {
            if (!adminUser || !adminUser.id) {
                setTimeout(loadDeposits, 500);
                return;
            }
            try {
                const res = await fetch(`/api/admin_deposits?user_id=${adminUser.id}`);
                const data = await res.json();
                renderDeposits(Array.isArray(data) ? data : []);
            } catch (e) { console.error(e); }
        }

        function renderDeposits(deposits) {
            const list = document.getElementById('depositList');
            if (deposits.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: var(--text-secondary); padding: 40px;">No requests found</div>';
                return;
            }

            list.innerHTML = deposits.map(d => {
                const egpAmountHtml = d.egp_amount ? `<p><strong>EGP Amount:</strong> <span style="font-weight: bold; color: var(--accent-green);">${d.egp_amount} EGP</span></p>` : '';
                return `
                <div class="deposit-card-premium">
                    <div class="dep-header">
                        <span class="dep-amount">$${(d.amount || 0).toFixed(2)}</span>
                        <span class="dep-status status-${d.status}">${d.status}</span>
                    </div>
                    <div class="dep-info">
                        <p><strong>User ID:</strong> ${d.user_id}</p>
                        <p><strong>Method:</strong> ${d.method || 'Manual'}</p>
                        ${egpAmountHtml}
                        ${d.sender_phone ? `<p><strong>Sender Phone:</strong> ${d.sender_phone}</p>` : ''}
                        <p><strong>Date:</strong> ${new Date(d.created_at).toLocaleString()}</p>
                    </div>

                    ${d.proof_link ? `
                        <button class="btn-view-proof" onclick="openModal('${d.proof_link}')">
                            <i class="fas fa-image"></i> View Receipt
                        </button>
                    ` : ''}
                    
                    ${d.status === 'pending' ? `
                        <div class="dep-actions" id="actions-${d.id}">
                            <button class="action-btn btn-reject" onclick="handleDeposit(${d.id}, 'reject')">
                                <i class="fas fa-times"></i> Reject
                            </button>
                            <button class="action-btn btn-approve" onclick="handleDeposit(${d.id}, 'approve')">
                                <i class="fas fa-check"></i> Approve
                            </button>
                        </div>
                    ` : ''}
                </div>
                `;
            }).join('');
        }

        async function handleDeposit(depId, action) {
            showConfirm(
                `${action.charAt(0).toUpperCase() + action.slice(1)} Request`,
                `Are you sure you want to <b>${action}</b> this deposit request?`,
                async () => {
                    const btnContainer = document.getElementById(`actions-${depId}`);
                    btnContainer.style.opacity = '0.5';
                    btnContainer.querySelectorAll('button').forEach(b => b.disabled = true);

                    try {
                        const endpoint = action === 'approve' ? '/api/approve_deposit' : '/api/reject_deposit';
                        const res = await fetch(endpoint, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                admin_id: adminUser?.id,
                                dep_id: depId,
                                reason: action === 'reject' ? 'Manual screening' : ''
                            })
                        });

                        const result = await res.json();
                        if (result.success) {
                            tg.HapticFeedback.notificationOccurred('success');
                            loadDeposits();
                        } else {
                            alert('Error: ' + result.error);
                            btnContainer.style.opacity = '1';
                            btnContainer.querySelectorAll('button').forEach(b => b.disabled = false);
                        }
                    } catch (e) {
                        alert('Connection error');
                        btnContainer.style.opacity = '1';
                        btnContainer.querySelectorAll('button').forEach(b => b.disabled = false);
                    }
                },
                action === 'reject'
            );
        }

        function showConfirm(title, msg, onConfirm, isDanger = false) {
            const modal = document.getElementById('confirmModal');
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMsg').innerHTML = msg;
            
            const yesBtn = document.getElementById('confirmYes');
            yesBtn.className = isDanger ? 'confirm-btn btn-yes reject' : 'confirm-btn btn-yes';
            
            modal.classList.add('open');
            
            const handleNo = () => { modal.classList.remove('open'); cleanup(); };
            const handleYes = () => { modal.classList.remove('open'); onConfirm(); cleanup(); };
            
            function cleanup() {
                document.getElementById('confirmNo').removeEventListener('click', handleNo);
                yesBtn.removeEventListener('click', handleYes);
            }
            
            document.getElementById('confirmNo').addEventListener('click', handleNo);
            yesBtn.addEventListener('click', handleYes);
        }

        function openModal(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imgModal').classList.add('open');
        }
        function closeModal() {
            document.getElementById('imgModal').classList.remove('open');
            document.getElementById('modalImg').src = '';
        }
        // Close modal on overlay click
        document.getElementById('imgModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        loadDeposits();
    </script>
</body>
</html>
