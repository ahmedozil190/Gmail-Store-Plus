<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gmail Store Plus</title>
    <link rel="stylesheet" href="/static/style.css?v=1.5">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- Sidebar / Drawer -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Gmail Store Plus</span>
            <div class="close-btn" onclick="toggleSidebar()">✕</div>
        </div>
        <div class="sidebar-items">
            <div class="sidebar-item active" onclick="navigate('home')">
                <span class="icon">🏠</span> Home
            </div>
            <div class="sidebar-item" onclick="navigate('products')">
                <span class="icon">🛒</span> Products
            </div>
            <div class="sidebar-item" onclick="navigate('orders')">
                <span class="icon">📜</span> My Orders
            </div>
            <div class="sidebar-item" onclick="navigate('deposit')">
                <span class="icon">💳</span> Deposit
            </div>
            <div class="sidebar-item" onclick="navigate('support')">
                <span class="icon">🎧</span> Support
            </div>
        </div>
    </div>
    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Header (Sticky) -->
        <div class="header-v2">
            <div class="menu-icon" onclick="toggleSidebar()">☰</div>
            <div class="header-title">Home</div>
            <div class="profile-circle" id="avatar">?</div>
        </div>

        <div style="padding: 16px;">
            <!-- Stats Card -->
            <div class="stats-card-v2">
            <div class="stat-row">
                <span class="stat-label">Current Balance</span>
                <span class="stat-val balance" id="balance">0.00$</span>
            </div>
            <div class="divider"></div>
            <div class="stat-row">
                <span class="stat-label">Total Spent</span>
                <span class="stat-val withdrawn" id="total-spent">0.00$</span>
            </div>
        </div>

        <!-- Section -->
        <div class="section-header">
            <div class="section-title">Available Products</div>
            <div class="view-all">View All</div>
        </div>

        <div id="products-list">
            <div class="product-card">
                <div class="product-info">
                    <h3>High Quality Gmail Accounts</h3>
                    <p>Price: $0.50 per account</p>
                </div>
                <button class="action-btn" onclick="buyOne()">Buy</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#0f172a';
        tg.backgroundColor = '#0f172a';

        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('avatar').innerText = (user.first_name || "?")[0].toUpperCase();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('visible');
        }

        function navigate(page) {
            toggleSidebar();
            // Logic for navigation
            console.log("Navigating to:", page);
        }

        async function loadData() {
            try {
                const response = await fetch(`/api/user_data?user_id=${user?.id}`);
                const data = await response.json();
                if (data.balance !== undefined) {
                    document.getElementById('balance').innerText = `${data.balance.toFixed(2)}$`;
                    document.getElementById('total-spent').innerText = `${(data.total_spent || 0).toFixed(2)}$`;
                }
            } catch (e) {
                console.error("Fetch error:", e);
            }
        }

        function buyOne() {
            tg.showConfirm("Are you sure you want to buy 1 account for $0.50?", (confirmed) => {
                if (confirmed) {
                    tg.sendData(JSON.stringify({action: 'buy', qty: 1}));
                    tg.close();
                }
            });
        }

        loadData();
    </script>
    </div> <!-- Close main padding -->
</body>
</html>
