<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gmail Store Plus</title>
    <link rel="stylesheet" href="/static/style.css?v=1.9">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- Main Container -->
    <div class="main-container">
        <!-- Header -->
        <div class="header">
            <div class="menu-icon">☰</div>
            <div class="header-title">Home</div>
            <div class="profile-circle" id="avatar">A</div>
        </div>

        <!-- Scrollable Content -->
        <div class="content-wrapper">
            <!-- Stats Card -->
            <div class="card stats-card">
                <div class="stat-row">
                    <span class="stat-label">Current Balance</span>
                    <span class="stat-value balance" id="balance">0.00 $</span>
                </div>
                <div class="divider"></div>
                <div class="stat-row">
                    <span class="stat-label">Total Withdrawn</span>
                    <span class="stat-value withdrawn" id="total-spent">0.00 $</span>
                </div>
                <div class="divider"></div>
                <div class="stat-row">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value pending" id="pending">0.00 $</span>
                </div>
            </div>

            <!-- Action Cards -->
            <div class="card action-card">
                <div class="action-icon-bg">
                    <span class="action-icon">+</span>
                </div>
                <div class="action-info">
                    <div class="action-title">New Task</div>
                    <div class="action-desc">Start earning rewards</div>
                </div>
            </div>

            <div class="card action-card">
                <div class="action-icon-bg">
                    <span class="action-icon">💼</span>
                </div>
                <div class="action-info">
                    <div class="action-title">Wallet</div>
                    <div class="action-desc">Manage your funds</div>
                </div>
            </div>

            <div class="card action-card">
                <div class="action-icon-bg">
                    <span class="action-icon">👥</span>
                </div>
                <div class="action-info">
                    <div class="action-title">Referrals</div>
                    <div class="action-desc">Invite and earn</div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            @Gmail_Store_Plus_Bot
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#0a0b10';
        tg.backgroundColor = '#0a0b10';

        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('avatar').innerText = (user.first_name || "A")[0].toUpperCase();
        }

        async function loadData() {
            try {
                const response = await fetch(`/api/user_data?user_id=${user?.id}`);
                const data = await response.json();
                if (data.balance !== undefined) {
                    document.getElementById('balance').innerText = `${data.balance.toFixed(2)} $`;
                    document.getElementById('total-spent').innerText = `${(data.total_spent || 0).toFixed(2)} $`;
                    document.getElementById('pending').innerText = "0.00 $";
                }
            } catch (e) {
                console.error("Fetch error:", e);
            }
        }
        loadData();
    </script>
</body>
</html>
