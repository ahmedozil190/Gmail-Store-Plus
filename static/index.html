<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gmail Store Plus</title>
    <link rel="stylesheet" href="/static/style.css?v=2.4">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="header">
            <div class="menu-icon">☰</div>
            <div class="header-title">Home</div>
            <div class="profile-circle" id="avatar">A</div>
        </div>

        <div class="content-wrapper">
            <!-- Stats Card -->
            <div class="card stats-card">
                <div class="stat-row">
                    <span class="stat-label">Current Balance</span>
                    <span class="stat-value balance" id="balance">0.00 $</span>
                </div>
                <div class="divider"></div>
                <div class="stat-row">
                    <span class="stat-label">Total Withdrawn</span>
                    <span class="stat-value withdrawn" id="total-spent">0.00 $</span>
                </div>
                <div class="divider"></div>
                <div class="stat-row">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value pending" id="pending">0.00 $</span>
                </div>
            </div>

            <!-- Shop Section -->
            <div id="products-list">
                <div class="card action-card" onclick="buyOne()">
                    <div class="action-icon-bg">
                        <span class="action-icon">🛒</span>
                    </div>
                    <div class="action-info">
                        <div class="action-title">Buy High Quality Gmails</div>
                        <div class="action-desc">Price: $0.50 per account</div>
                    </div>
                </div>
            </div>

            <div class="card action-card">
                <div class="action-icon-bg">
                    <span class="action-icon">💼</span>
                </div>
                <div class="action-info">
                    <div class="action-title">My Orders</div>
                    <div class="action-desc">Check your purchase history</div>
                </div>
            </div>

            <div class="card action-card">
                <div class="action-icon-bg">
                    <span class="action-icon">🎧</span>
                </div>
                <div class="action-info">
                    <div class="action-title">Support</div>
                    <div class="action-desc">Need help? Contact us</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        // Sync with Telegram Frame color
        tg.headerColor = '#232e3c'; 
        tg.backgroundColor = '#232e3c';

        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('avatar').innerText = (user.first_name || "A")[0].toUpperCase();
        }

        async function loadData() {
            try {
                const response = await fetch(`/api/user_data?user_id=${user?.id}`);
                const data = await response.json();
                if (data.balance !== undefined) {
                    document.getElementById('balance').innerText = `${data.balance.toFixed(2)} $`;
                    document.getElementById('total-spent').innerText = `${(data.total_spent || 0).toFixed(2)} $`;
                    document.getElementById('pending').innerText = "0.00 $";
                }
            } catch (e) { console.error(e); }
        }

        function buyOne() {
            tg.showConfirm("Buy 1 Gmail account for $0.50?", (confirmed) => {
                if (confirmed) {
                    tg.sendData(JSON.stringify({action: 'buy', qty: 1}));
                    tg.close();
                }
            });
        }

        loadData();
    </script>
</body>
</html>
