<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventory Pool - Admin Console</title>
    <link rel="stylesheet" href="/static/style.css?v=3.9">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --card-blue: rgba(22, 36, 61, 0.75);
            --card-red: rgba(45, 26, 30, 0.75);
            --tab-bg: rgba(26, 34, 48, 0.9);
            --tab-active: #3b82f6;
            --purple-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --glass-blur: blur(12px);
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card-mini {
            background: rgba(255, 255, 255, 0.03);
            border: var(--glass-border);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
        }

        .stat-card-mini.total { border-color: rgba(59, 130, 246, 0.3); background: var(--card-blue); }
        .stat-card-mini.sold { border-color: rgba(239, 68, 68, 0.3); background: var(--card-red); }

        .stat-card-mini .label {
            display: block;
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--text-secondary);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .stat-card-mini .value { font-size: 1.5rem; font-weight: 900; color: #fff; }

        .action-card {
            background: var(--tab-bg);
            border: var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 25px;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
        }

        .tabs-container {
            background: #111827;
            border-radius: 14px;
            display: flex;
            padding: 5px;
            margin-bottom: 20px;
        }

        .tab-item {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-item.active { background: var(--tab-active); color: #fff; }

        .search-box-fancy { position: relative; margin-bottom: 15px; }
        .search-input-fancy {
            width: 100%;
            background: #111827;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 14px 15px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .btn-find {
            width: 100%;
            background: var(--purple-grad);
            border: none;
            border-radius: 14px;
            padding: 14px;
            color: #fff;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1rem;
            cursor: pointer;
        }

        .management-section { margin-top: 0; }
        .management-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .management-title { font-size: 1.1rem; font-weight: 800; color: #fff; }
        .results-badge {
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .account-list-new { display: flex; flex-direction: column; gap: 15px; }
        
        .account-card-premium {
            background: rgba(17, 24, 39, 0.7);
            border: var(--glass-border);
            border-radius: 24px;
            padding: 20px;
        }

        .acc-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .acc-card-header .email { font-size: 0.95rem; font-weight: 800; color: #fff; word-break: break-all; flex: 1; margin-right: 10px; }
        .acc-card-header .status-check {
            width: 24px;
            height: 24px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.7rem;
            flex-shrink: 0;
        }

        .acc-card-header.sold .status-check { background: rgba(255,255,255,0.05); color: var(--text-secondary); }

        .acc-card-sub {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .acc-card-sub .public-id { color: #3b82f6; font-size: 0.85rem; font-weight: 800; }
        .acc-card-sub .delete-btn { color: #ef4444; font-size: 0.9rem; cursor: pointer; padding: 5px; opacity: 0.7; }
        .acc-card-sub .delete-btn:hover { opacity: 1; }

        /* Deletion Modal (Same as previous) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .custom-modal {
            background: var(--tab-bg);
            border: var(--glass-border);
            border-radius: 28px;
            padding: 30px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            backdrop-filter: var(--glass-blur);
        }
        .modal-icon {
            width: 60px; height: 60px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; margin: 0 auto 20px;
        }
        .modal-title { font-size: 1.2rem; font-weight: 800; color: #fff; margin-bottom: 10px; }
        .modal-desc { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 25px; line-height: 1.5; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .modal-btn { padding: 14px; border-radius: 14px; font-weight: 700; border: none; cursor: pointer; font-size: 0.95rem; }
        .modal-btn-confirm { background: #ef4444; color: #fff; }
        .modal-btn-cancel { background: rgba(255,255,255,0.05); color: #fff; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo" style="color: var(--warning);">Admin Console</span>
                <button class="close-sidebar" id="closeBtn"><i class="fas fa-times"></i></button>
            </div>
            <div class="sidebar-nav">
                <a href="/admin_panel" class="sidebar-item">
                    <i class="fas fa-chart-pie"></i> <span>Dashboard</span>
                </a>
                <a href="/admin_users" class="sidebar-item">
                    <i class="fas fa-users-cog"></i> <span>Manage Users</span>
                </a>
                <a href="/admin_inventory" class="sidebar-item active">
                    <i class="fas fa-box-open"></i> <span>Inventory</span>
                </a>
                <a href="/admin_deposits" class="sidebar-item">
                    <i class="fas fa-file-invoice-dollar"></i> <span>Deposits</span>
                </a>
                <a href="/" class="sidebar-item" style="opacity: 0.7;">
                    <i class="fas fa-sign-out-alt"></i> <span>Exit Admin</span>
                </a>
            </div>
        </nav>
        <div class="sidebar-overlay" id="overlay"></div>

        <header class="page-title">
            <div class="page-title-inner">
                <button class="hamburger-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
                <span>Account Pool</span>
                <div class="page-title-avatar" id="avatar">A</div>
            </div>
        </header>

        <main class="main-content">
            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-card-mini total">
                    <span class="label">Available</span>
                    <span class="value" id="countAvailable">0</span>
                </div>
                <div class="stat-card-mini sold">
                    <span class="label">Sold</span>
                    <span class="value" id="countSold">0</span>
                </div>
            </div>

            <!-- Filters & Search -->
            <div class="action-card">
                <div class="tabs-container">
                    <div class="tab-item active" onclick="setTab('all', this)">All</div>
                    <div class="tab-item" onclick="setTab('available', this)">Available</div>
                    <div class="tab-item" onclick="setTab('sold', this)">Sold</div>
                </div>

                <div class="search-box-fancy">
                    <input type="text" class="search-input-fancy" id="accSearch" placeholder="Search by Email or ID...">
                </div>

                <button class="btn-find" onclick="applySearch()">
                    <i class="fas fa-search"></i> Find
                </button>
            </div>

            <!-- Management Section Card -->
            <div class="management-section action-card">
                <div class="management-header">
                    <h2 class="management-title">Inventory Control</h2>
                    <span class="results-badge" id="resultsCount">0 results</span>
                </div>

                <div class="account-list-new" id="accountList">
                    <div style="text-align: center; color: var(--text-secondary); padding: 40px;">
                        <i class="fas fa-spinner fa-spin"></i> Loading...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="custom-modal">
            <div class="modal-icon"><i class="fas fa-trash-alt"></i></div>
            <h3 class="modal-title">Delete Account?</h3>
            <p class="modal-desc">Are you sure you want to remove this account? This will permanently delete item #<span id="delIdDisplay"></span>.</p>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-confirm" onclick="confirmDelete()">Delete Now</button>
                <button class="modal-btn modal-btn-cancel" onclick="closeDeleteModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const adminUser = tg.initDataUnsafe.user;
        if (adminUser) document.getElementById('avatar').innerText = (adminUser.first_name || "A")[0].toUpperCase();

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');

        menuBtn.onclick = () => { sidebar.classList.add('open'); overlay.classList.add('open'); }
        closeBtn.onclick = overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

        let allAccounts = [];
        let currentFilter = 'all';

        async function loadAccounts() {
            if (!adminUser || !adminUser.id) {
                setTimeout(loadAccounts, 500);
                return;
            }
            try {
                const res = await fetch(`/api/admin_accounts?user_id=${adminUser.id}`);
                const data = await res.json();
                if (data.error) {
                    document.getElementById('accountList').innerHTML = `Error: ${data.error}`;
                    return;
                }
                allAccounts = Array.isArray(data) ? data : [];
                updateStats();
                applySearch();
            } catch (e) { console.error(e); }
        }

        function updateStats() {
            document.getElementById('countAvailable').innerText = allAccounts.filter(a => a.status === 'available').length;
            document.getElementById('countSold').innerText = allAccounts.filter(a => a.status === 'sold').length;
        }

        function setTab(filter, el) {
            currentFilter = filter;
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            applySearch();
        }

        function applySearch() {
            const query = document.getElementById('accSearch').value.toLowerCase();
            let filtered = allAccounts;

            if (currentFilter !== 'all') {
                filtered = filtered.filter(a => a.status === currentFilter);
            }

            if (query) {
                filtered = filtered.filter(a => 
                    (a.email && a.email.toLowerCase().includes(query)) ||
                    (a.public_id && a.public_id.toString().includes(query)) ||
                    (`#${a.public_id}`).includes(query)
                );
            }

            renderAccounts(filtered);
        }

        function renderAccounts(accounts) {
            const list = document.getElementById('accountList');
            document.getElementById('resultsCount').innerText = `${accounts.length} results`;

            if (accounts.length === 0) {
                list.innerHTML = `<div style="text-align: center; color: var(--text-secondary); padding: 40px;">No accounts found</div>`;
                return;
            }

            list.innerHTML = accounts.map(a => {
                const isSold = a.status === 'sold';
                return `
                <div class="account-card-premium">
                    <div class="acc-card-header ${isSold ? 'sold' : ''}">
                        <span class="email">${a.email || 'Mystery Account'}</span>
                        <div class="status-check">
                            <i class="fas ${isSold ? 'fa-shopping-cart' : 'fa-check'}"></i>
                        </div>
                    </div>
                    
                    <div class="acc-card-sub">
                        <span class="public-id">ID: #${a.public_id}</span>
                        <span class="delete-btn" onclick="openDeleteModal(${a.public_id})">
                            <i class="fas fa-trash-alt"></i>
                        </span>
                    </div>
                </div>
                `;
            }).join('');
        }

        let idToDelete = null;

        function openDeleteModal(pid) {
            idToDelete = pid;
            document.getElementById('delIdDisplay').innerText = pid;
            document.getElementById('deleteModal').classList.add('open');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('open');
            idToDelete = null;
        }

        async function confirmDelete() {
            if (!idToDelete) return;
            // API Logic for deletion by public_id or internal id would go here
            alert(`Simulated: Account #${idToDelete} deleted successfully!`);
            closeDeleteModal();
        }

        loadAccounts();
    </script>
</body>
</html>
