<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventory Management - Admin Console</title>
    <link rel="stylesheet" href="/static/style.css?v=3.8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --glass-bg: rgba(26, 34, 48, 0.85);
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --glass-blur: blur(12px);
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
        }

        .inventory-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .inv-card {
            background: var(--glass-bg);
            border: var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            text-align: center;
        }

        .inv-card .label { display: block; font-size: 0.7rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 5px; }
        .inv-card .value { font-size: 1.8rem; font-weight: 900; color: #fff; }

        .filter-container {
            background: var(--glass-bg);
            border: var(--glass-border);
            border-radius: 20px;
            padding: 6px;
            display: flex;
            margin-bottom: 25px;
            backdrop-filter: var(--glass-blur);
        }

        .filter-tab {
            flex: 1;
            padding: 12px;
            border-radius: 16px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tab.active { background: var(--accent-blue); color: #fff; }

        .account-list { display: flex; flex-direction: column; gap: 12px; }
        
        .account-card-premium {
            background: rgba(17, 24, 39, 0.7);
            border: var(--glass-border);
            border-radius: 20px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s;
        }

        .acc-icon {
            width: 45px;
            height: 45px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-blue);
            font-size: 1.2rem;
        }

        .acc-info { flex: 1; }
        .acc-email { display: block; font-weight: 700; color: #fff; font-size: 0.9rem; word-break: break-all; }
        .acc-meta { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }
        
        .status-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        .status-available { background: #10b981; color: #fff; }
        .status-sold { background: rgba(255,255,255,0.05); color: var(--text-secondary); }

        .acc-actions { display: flex; gap: 8px; }
        .action-tool { width: 35px; height: 35px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; transition: 0.2s; }
        .action-tool:hover { background: rgba(255,255,255,0.1); }
        .action-tool.delete:hover { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

        /* Custom Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        
        .custom-modal {
            background: var(--glass-bg);
            border: var(--glass-border);
            border-radius: 28px;
            padding: 30px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            backdrop-filter: var(--glass-blur);
        }

        .modal-icon {
            width: 60px;
            height: 60px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 20px;
        }

        .modal-title { font-size: 1.2rem; font-weight: 800; color: #fff; margin-bottom: 10px; }
        .modal-desc { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 25px; line-height: 1.5; }
        
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .modal-btn { padding: 14px; border-radius: 14px; font-weight: 700; border: none; cursor: pointer; font-size: 0.95rem; }
        .modal-btn-confirm { background: #ef4444; color: #fff; }
        .modal-btn-cancel { background: rgba(255,255,255,0.05); color: #fff; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo" style="color: var(--warning);">Admin Console</span>
                <button class="close-sidebar" id="closeBtn"><i class="fas fa-times"></i></button>
            </div>
            <div class="sidebar-nav">
                <a href="/admin_panel" class="sidebar-item">
                    <i class="fas fa-chart-pie"></i> <span>Dashboard</span>
                </a>
                <a href="/admin_users" class="sidebar-item">
                    <i class="fas fa-users-cog"></i> <span>Manage Users</span>
                </a>
                <a href="/admin_inventory" class="sidebar-item active">
                    <i class="fas fa-box-open"></i> <span>Inventory</span>
                </a>
                <a href="/admin_deposits" class="sidebar-item">
                    <i class="fas fa-file-invoice-dollar"></i> <span>Deposits</span>
                </a>
                <a href="/" class="sidebar-item" style="opacity: 0.7;">
                    <i class="fas fa-sign-out-alt"></i> <span>Exit Admin</span>
                </a>
            </div>
        </nav>
        <div class="sidebar-overlay" id="overlay"></div>

        <header class="page-title">
            <div class="page-title-inner">
                <button class="hamburger-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
                <span>Inventory Pool</span>
                <div class="page-title-avatar" id="avatar">A</div>
            </div>
        </header>

        <main class="main-content">
            <div class="inventory-stats">
                <div class="inv-card">
                    <span class="label">Available</span>
                    <span class="value" id="countAvailable">0</span>
                </div>
                <div class="inv-card">
                    <span class="label">Sold</span>
                    <span class="value" id="countSold">0</span>
                </div>
            </div>

            <div class="filter-container">
                <div class="filter-tab active" onclick="setFilter('all', this)">All</div>
                <div class="filter-tab" onclick="setFilter('available', this)">Available</div>
                <div class="filter-tab" onclick="setFilter('sold', this)">Sold</div>
            </div>

            <div class="account-list" id="accountList">
                <div style="text-align: center; color: var(--text-secondary); padding: 40px;">
                    <i class="fas fa-spinner fa-spin"></i> Loading inventory...
                </div>
            </div>
        </main>
    </div>

    <!-- Custom Deletion Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="custom-modal">
            <div class="modal-icon"><i class="fas fa-trash-alt"></i></div>
            <h3 class="modal-title">Delete Account?</h3>
            <p class="modal-desc">Are you sure you want to remove this account from the pool? This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-confirm" id="confirmDeleteBtn">Delete Now</button>
                <button class="modal-btn modal-btn-cancel" onclick="closeDeleteModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const adminUser = tg.initDataUnsafe.user;
        if (adminUser) document.getElementById('avatar').innerText = (adminUser.first_name || "A")[0].toUpperCase();

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');

        menuBtn.onclick = () => { sidebar.classList.add('open'); overlay.classList.add('open'); }
        closeBtn.onclick = overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

        let allAccounts = [];
        let currentFilter = 'all';

        async function loadAccounts() {
            if (!adminUser || !adminUser.id) {
                setTimeout(loadAccounts, 500);
                return;
            }
            try {
                const res = await fetch(`/api/admin_accounts?user_id=${adminUser.id}`);
                const data = await res.json();
                if (data.error) {
                    document.getElementById('accountList').innerHTML = `Error: ${data.error}`;
                    return;
                }
                allAccounts = Array.isArray(data) ? data : [];
                updateStats();
                applyFilter();
            } catch (e) { console.error(e); }
        }

        function updateStats() {
            document.getElementById('countAvailable').innerText = allAccounts.filter(a => a.status === 'available').length;
            document.getElementById('countSold').innerText = allAccounts.filter(a => a.status === 'sold').length;
        }

        function setFilter(filter, el) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            applyFilter();
        }

        function applyFilter() {
            let filtered = allAccounts;
            if (currentFilter !== 'all') {
                filtered = allAccounts.filter(a => a.status === currentFilter);
            }
            renderAccounts(filtered);
        }

        function renderAccounts(accounts) {
            const list = document.getElementById('accountList');
            if (accounts.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: var(--text-secondary); padding: 40px;">No matching accounts found</div>';
                return;
            }

            list.innerHTML = accounts.map(a => {
                const isSold = a.status === 'sold';
                return `
                <div class="account-card-premium">
                    <div class="acc-icon">
                        <i class="fas ${isSold ? 'fa-shopping-bag' : 'fa-envelope'}"></i>
                    </div>
                    <div class="acc-info">
                        <span class="acc-email">${a.email || 'Mystery Account'}</span>
                        <span class="acc-meta">ID: #${a.id}</span>
                    </div>
                    <div class="status-badge ${isSold ? 'status-sold' : 'status-available'}">
                        <i class="fas ${isSold ? 'fa-shopping-cart' : 'fa-check'}"></i>
                    </div>
                    <div class="acc-actions">
                        <div class="action-tool delete" onclick="openDeleteModal(${a.id})">
                            <i class="fas fa-trash-alt"></i>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        let accountToDelete = null;

        function openDeleteModal(id) {
            accountToDelete = id;
            document.getElementById('deleteModal').classList.add('open');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('open');
            accountToDelete = null;
        }

        document.getElementById('confirmDeleteBtn').onclick = async () => {
            if (!accountToDelete) return;
            // API logic would go here
            alert(`Simulated: Account #${accountToDelete} deleted.`);
            closeDeleteModal();
            // Optionally reload: loadAccounts();
        }

        loadAccounts();
    </script>
</body>
</html>
