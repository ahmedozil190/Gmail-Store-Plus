<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Crypto Deposit - Gmail Store Plus</title>
    <link rel="stylesheet" href="/static/style.css?v=3.7">
    <link rel="stylesheet" href="/static/webapp.css?v=3.7">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .crypto-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .promo-card {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 30px 20px;
            text-align: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .promo-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .promo-card i { 
            font-size: 2.8rem; 
            margin-bottom: 20px; 
            display: block; 
            background: linear-gradient(135deg, #f59e0b, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .promo-card h3 { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; }
        .promo-card p { font-size: 0.9rem; opacity: 0.7; font-weight: 500; }

        .amount-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .amount-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 22px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .amount-btn.active {
            background: rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }

        .amount-btn .val { font-size: 1.25rem; font-weight: 900; color: #fff; display: block; margin-bottom: 2px; }
        .amount-btn .label { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }

        .custom-amount-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: 0.2s;
        }
        .custom-amount-input:focus { border-color: rgba(59, 130, 246, 0.5); background: rgba(255, 255, 255, 0.08); }

        /* Hide Number Spinners */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .back-btn:active { color: #fff; transform: scale(0.9); }

        .pay-btn {
            background: linear-gradient(90deg, #3b82f6, #2563eb);
            color: #fff;
            border: none;
            border-radius: 18px;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25);
            transition: 0.2s;
        }
        .pay-btn:active { transform: scale(0.98); }
        .pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="page-title">
            <div class="page-title-inner">
                <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
                <span>Crypto Deposit</span>
                <div class="page-title-avatar" id="avatar">A</div>
            </div>
        </header>

        <main class="main-content">
            <div class="crypto-container">
                <div class="promo-card">
                    <i class="fas fa-coins"></i>
                    <h3>Automatic Payment</h3>
                    <p>USDT, BTC, ETH and many more. Instant balance update via Cryptomus.</p>
                </div>

                <div class="amount-grid">
                    <div class="amount-btn" onclick="selectAmount(5, this)">
                        <span class="val">$5</span>
                        <span class="label">Starter</span>
                    </div>
                    <div class="amount-btn active" onclick="selectAmount(10, this)">
                        <span class="val">$10</span>
                        <span class="label">Popular</span>
                    </div>
                    <div class="amount-btn" onclick="selectAmount(20, this)">
                        <span class="val">$20</span>
                        <span class="label">Pro</span>
                    </div>
                    <div class="amount-btn" onclick="selectAmount(50, this)">
                        <span class="val">$50</span>
                        <span class="label">Whale</span>
                    </div>
                </div>

                <input type="number" id="customAmount" class="custom-amount-input" placeholder="Custom amount">

                <button class="pay-btn" id="payBtn" onclick="generateInvoice()">Generate Crypto Invoice</button>
            </div>
        </main>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const user = tg.initDataUnsafe.user;
        if (user) document.getElementById('avatar').innerText = (user.first_name || "A")[0].toUpperCase();

        let selectedAmount = 10;

        function selectAmount(val, el) {
            selectedAmount = val;
            document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('customAmount').value = '';
            tg.HapticFeedback.selectionChanged();
        }

        const customInput = document.getElementById('customAmount');
        customInput.oninput = () => {
            if (customInput.value > 0) {
                selectedAmount = parseFloat(customInput.value);
                document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('active'));
            }
        };

        async function generateInvoice() {
            const btn = document.getElementById('payBtn');
            if (selectedAmount < 1) {
                tg.showAlert('Minimum deposit is $1.00');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Creating Invoice...';

            try {
                const res = await fetch('/api/create_crypto_invoice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: user.id,
                        amount: selectedAmount
                    })
                });
                const data = await res.json();
                if (data.url) {
                    window.location.href = data.url;
                } else {
                    tg.showAlert('Error: ' + data.error);
                }
            } catch (e) {
                tg.showAlert('Service temporary unavailable.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Generate Crypto Invoice';
            }
        }
    </script>
</body>
</html>
